<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promoções WZ Turismo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F4F7FD;color:#0A1628;padding:24px 16px}
  header{text-align:center;margin-bottom:24px}
  header h2{font-size:28px;font-weight:800;color:#1A4BD4}
  header p{color:#4A5B78;margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;max-width:1200px;margin:0 auto}
  .card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(10,22,40,.10);display:flex;flex-direction:column}
  .foto img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
  .info{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
  .info h3{font-size:20px;font-weight:800}
  .preco{font-size:22px;font-weight:800;color:#E21B26}
  .inc,.per{font-size:14px;color:#4A5B78;line-height:1.4}
  .btn{margin-top:auto;display:block;text-align:center;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;
    font-weight:800;text-decoration:none;padding:13px;border-radius:40px;margin-top:12px}
  .vazio{text-align:center;color:#4A5B78;padding:40px}
  footer{text-align:center;font-size:12px;color:#8492A6;margin-top:24px}
</style></head>
<body>
  <header><h2>✈️ Promoções da semana</h2><p>Valores sujeitos a alteração e disponibilidade. Fale com a WZ Turismo para confirmar.</p></header>
  <p class="vazio">Novas promoções em breve! Chame a WZ no WhatsApp.</p>
  <footer>Atualizado em 22/10/2026 · WZ Turismo</footer>
</body></html>
